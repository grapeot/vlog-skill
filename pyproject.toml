[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vlog-skill"
version = "0.1.0"
description = "Agent workflow and CLI for narrated talking-head explainer videos: script, voice edit, verification, avatar video, subtitles."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
asr = ["mlx-qwen3-asr==0.4.4"]
dev = ["pytest>=8"]

[project.scripts]
vlog = "vlog_skill.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
